<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dental Desk Console</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold text-info" href="admin.html"><i class="bi bi-shield-lock-fill me-2"></i>Dental Staff Desk</a>
        <div class="d-flex align-items-center">
            <span class="text-white-50 me-3 small" id="admin-user-badge">Verifying...</span>
            <button class="btn btn-outline-danger btn-sm rounded-pill" id="btn-admin-logout">Sign Out</button>
        </div>
    </div>
</nav>
<div class="container-fluid px-4 my-4">
    <div class="row g-3 mb-4">
        <div class="col-12 col-sm-6 col-xl-3"><div class="card border-0 shadow-sm p-3 border-start border-primary border-4 rounded-3"><small class="text-muted fw-bold">TODAY'S BOOKINGS</small><h3 class="fw-bold mb-0 text-dark" id="stat-total-appts">0</h3></div></div>
        <div class="col-12 col-sm-6 col-xl-3"><div class="card border-0 shadow-sm p-3 border-start border-warning border-4 rounded-3"><small class="text-muted fw-bold">WAITING IN QUEUE</small><h3 class="fw-bold mb-0 text-dark" id="stat-waiting">0</h3></div></div>
        <div class="col-12 col-sm-6 col-xl-3"><div class="card border-0 shadow-sm p-3 border-start border-success border-4 rounded-3"><small class="text-muted fw-bold">SERVED</small><h3 class="fw-bold mb-0 text-dark" id="stat-served">0</h3></div></div>
        <div class="col-12 col-sm-6 col-xl-3"><div class="card border-0 shadow-sm p-3 border-start border-danger border-4 rounded-3"><small class="text-muted fw-bold">NO-SHOWS</small><h3 class="fw-bold mb-0 text-dark" id="stat-noshow">0</h3></div></div>
    </div>
    <div class="card border-0 shadow-sm rounded-4 mb-4">
        <div class="card-header bg-white py-3 d-flex flex-wrap justify-content-between align-items-center">
            <h5 class="m-0 fw-bold"><i class="bi bi-people me-2 text-primary"></i>Live Queue Roster</h5>
            <a href="api/reports.php?action=export-csv" class="btn btn-outline-secondary btn-sm"><i class="bi bi-file-earmark-spreadsheet me-1"></i>Export Daily CSV</a>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr><th>Order</th><th>Token</th><th>Client Ref</th><th>Service</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody id="admin-queue-tbody"><tr><td colspan="6" class="text-center py-4 text-muted">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
