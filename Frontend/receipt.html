<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Appointment receipt - Dental Clinic Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="receipt-page">
  <main class="receipt-sheet" id="receipt">
    <div class="receipt-top">
      <div class="brand"><span class="brand-mark">D</span><span>Dental Clinic Online</span></div>
      <span class="receipt-tag">Appointment record</span>
    </div>
    <div id="form-alert" class="alert" role="alert" hidden></div>
    <div id="receipt-body" hidden>
      <p class="next-label" id="rec-ref"></p>
      <h1 id="rec-clinic"></h1>
      <p class="page-sub" id="rec-lead"></p>
      <div class="receipt-status"><span id="rec-status"></span><strong id="rec-date"></strong></div>
      <dl class="receipt-details" id="rec-details"></dl>
      <p class="receipt-note">This is an appointment record, not proof of payment. Pending appointments need clinic confirmation.</p>
      <div class="receipt-actions">
        <button type="button" class="btn btn-primary" id="print-btn">Print / Save as PDF</button>
        <a href="appointments.html">Back to appointments</a>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/fake-data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/receipt.js"></script>
</body>
</html>
