<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alerts - Dental Clinic Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header" data-active="alerts"></header>

  <main class="page">
    <div class="page-head">
      <div>
        <h1 class="page-title">Alerts</h1>
        <p class="page-sub">Appointment messages and calendar actions in one place.</p>
      </div>
    </div>

    <div id="form-alert" class="alert" role="alert" hidden></div>

    <div class="queue-layout">
      <section class="card-surface booking-card" aria-labelledby="alerts-title">
        <div class="section-head"><h2 id="alerts-title">Notifications</h2><span class="count" id="alert-count"></span></div>
        <div id="alert-list"></div>
      </section>

      <aside class="card-surface booking-card">
        <h2>Add your visits to your calendar</h2>
        <div id="calendar-sync"></div>
      </aside>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/fake-data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/alerts.js"></script>
</body>
</html>
