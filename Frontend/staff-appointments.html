<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Appointments - Dental Clinic Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="ops-shell">
    <aside id="ops-sidebar" data-active="appointments"></aside>
    <main class="ops-main">
      <div class="ops-head">
        <div><h1 class="page-title">Appointments</h1><p class="page-sub">Review, confirm, and update every booking.</p></div>
        <a class="btn btn-primary" href="staff-walk-in.html">+ Add walk-in</a>
      </div>
      <div id="form-alert" class="alert" role="alert" hidden></div>
      <section class="card-surface booking-card">
        <div class="filters">
          <input type="search" id="f-search" class="form-control" placeholder="Search patient or service" aria-label="Search">
          <select id="f-status" class="form-select" aria-label="Status">
            <option value="">All statuses</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option>
            <option value="completed">Completed</option><option value="cancelled">Cancelled</option><option value="no_show">No-show</option>
          </select>
          <input type="date" id="f-date" class="form-control" aria-label="Date">
        </div>
        <div class="table-wrap"><table class="ops-table">
          <thead><tr><th>Date</th><th>Time</th><th>Patient</th><th>Service</th><th>Dentist</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="rows"></tbody>
        </table></div>
        <p class="count" id="row-count"></p>
      </section>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/fake-data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ops-layout.js"></script>
  <script src="js/staff-appointments.js"></script>
</body>
</html>
