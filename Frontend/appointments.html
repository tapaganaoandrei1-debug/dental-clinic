<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My appointments - Dental Clinic Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header" data-active="appointments"></header>

  <main class="page">
    <div class="page-head">
      <div>
        <h1 class="page-title">My appointments</h1>
        <p class="page-sub">Your upcoming care and appointment history.</p>
      </div>
      <a class="btn btn-primary" href="book.html">Book appointment</a>
    </div>

    <div id="form-alert" class="alert" role="alert" hidden></div>

    <section id="next-visit" class="card-surface next-visit" hidden></section>

    <div class="support-grid">
      <section class="card-surface booking-card">
        <div class="section-head"><h2>Recent updates</h2><a href="alerts.html">All alerts</a></div>
        <div id="updates"></div>
      </section>
      <section class="card-surface booking-card">
        <h2>Add to your calendar</h2>
        <div id="calendar-sync"></div>
      </section>
    </div>

    <section class="card-surface booking-card" aria-labelledby="history-title">
      <div class="section-head">
        <h2 id="history-title">Appointment history</h2>
        <span class="count" id="visit-count"></span>
      </div>
      <div class="tabs" role="group" aria-label="Filter appointments">
        <button type="button" class="tab" data-filter="all" aria-pressed="true">All</button>
        <button type="button" class="tab" data-filter="upcoming" aria-pressed="false">Upcoming</button>
        <button type="button" class="tab" data-filter="past" aria-pressed="false">Past</button>
      </div>
      <div id="visit-list"></div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/fake-data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/appointments.js"></script>
</body>
</html>
