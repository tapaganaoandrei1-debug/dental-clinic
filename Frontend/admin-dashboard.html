<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin dashboard - Dental Clinic Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="ops-shell">
    <aside id="ops-sidebar" data-active="dashboard"></aside>
    <main class="ops-main">
      <div class="ops-head">
        <div>
          <h1 class="page-title">Dashboard</h1>
          <p class="page-sub" id="today-label"></p>
        </div>
        <a class="btn btn-primary" href="staff-walk-in.html">+ Add walk-in</a>
      </div>
      <div id="form-alert" class="alert" role="alert" hidden></div>

      <div class="stat-grid">
        <div class="card-surface stat"><span>Today's appointments</span><strong id="st-appts">-</strong><small id="st-appts-sub"></small></div>
        <div class="card-surface stat"><span>In queue now</span><strong id="st-queue">-</strong><small id="st-serving"></small></div>
        <div class="card-surface stat"><span>Avg. wait time</span><strong id="st-wait">-</strong><small>Based on today's visits</small></div>
        <div class="card-surface stat"><span>No-shows today</span><strong id="st-noshow">-</strong><small id="st-cancel"></small></div>
      </div>

      <div class="ops-grid">
        <section class="card-surface booking-card">
          <div class="section-head"><h2>Live queue</h2><button type="button" class="btn btn-primary btn-sm" id="call-next">Call next</button></div>
          <div class="table-wrap"><table class="ops-table">
            <thead><tr><th>Ticket</th><th>Patient</th><th>Service</th><th>Status</th><th>Action</th></tr></thead>
            <tbody id="queue-rows"></tbody>
          </table></div>
        </section>
        <section class="card-surface booking-card">
          <div class="section-head"><h2>Today's schedule</h2><span class="count" id="sched-date"></span></div>
          <div id="schedule"></div>
          <a href="staff-appointments.html">View all appointments &rarr;</a>
        </section>
      </div>
    
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/fake-data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ops-layout.js"></script>
  <script src="js/staff-dashboard.js"></script>
</body>
</html>
