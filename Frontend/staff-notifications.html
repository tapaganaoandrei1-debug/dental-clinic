<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications - Dental Clinic Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="ops-shell">
    <aside id="ops-sidebar" data-active="notifications"></aside>
    <main class="ops-main">
      <div class="ops-head">
        <div><h1 class="page-title">Notifications</h1><p class="page-sub">Messages sent to patients about their appointments.</p></div>
        <button type="button" class="btn btn-primary" id="remind-btn">Send reminders for tomorrow</button>
      </div>
      <div id="form-alert" class="alert" role="alert" hidden></div>
      <section class="card-surface booking-card">
        <div class="table-wrap"><table class="ops-table">
          <thead><tr><th>Sent</th><th>Recipient</th><th>Type</th><th>Subject</th><th>Status</th></tr></thead>
          <tbody id="rows"></tbody>
        </table></div>
      </section>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/fake-data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ops-layout.js"></script>
  <script src="js/staff-notifications.js"></script>
</body>
</html>
