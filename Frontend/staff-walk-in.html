<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add walk-in - Dental Clinic Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="ops-shell">
    <aside id="ops-sidebar" data-active="walkin"></aside>
    <main class="ops-main">
      <div class="ops-head">
        <div><h1 class="page-title">Add walk-in</h1><p class="page-sub">Register a patient who arrives without a booking. They join the queue right away.</p></div>
        
      </div>
      <div id="form-alert" class="alert" role="alert" hidden></div>
      <div class="ops-grid">
        <section class="card-surface booking-card">
          <form id="walkin-form" novalidate>
            <div class="form-grid">
              <div class="span-2"><label for="name" class="form-label">Patient name</label><input id="name" class="form-control" maxlength="100"><p id="name-error" class="field-error" hidden></p></div>
              <div><label for="phone" class="form-label">Phone <span class="text-secondary fw-normal">(optional)</span></label><input id="phone" class="form-control" maxlength="20"><p id="phone-error" class="field-error" hidden></p></div>
              <div><label for="service" class="form-label">Service</label><select id="service" class="form-select"></select></div>
              <div><label for="dentist" class="form-label">Dentist</label><select id="dentist" class="form-select"></select></div>
              <div class="span-2"><label for="notes" class="form-label">Notes <span class="text-secondary fw-normal">(optional)</span></label><textarea id="notes" class="form-control" rows="2" maxlength="500"></textarea></div>
            </div>
            <button type="submit" id="submit-btn" class="btn btn-primary mt-3">Add to queue</button>
          </form>
        </section>
        <section class="card-surface booking-card" id="walkin-done" hidden>
          <h2>Added to the queue</h2>
          <div class="ticket-number ticket-soft"><span>Queue number</span><strong id="done-number">-</strong></div>
          <p class="field-hint" id="done-text"></p>
          <a class="btn btn-outline-secondary" href="staff-queue.html">Open queue control</a>
        </section>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/fake-data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ops-layout.js"></script>
  <script src="js/staff-walk-in.js"></script>
</body>
</html>
