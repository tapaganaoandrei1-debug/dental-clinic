<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrightSmile Dental Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-heart-pulse-fill me-2"></i>BrightSmile Clinic</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link active" href="#booking-section">Book Appointment</a></li>
                <li class="nav-item"><a class="nav-link" href="#tracker-section">Live Queue</a></li>
                <li class="nav-item ms-lg-3" id="auth-nav-container">
                    <button class="btn btn-outline-light btn-sm rounded-pill px-3" data-bs-toggle="modal" data-bs-target="#authModal">
                        <i class="bi bi-person-circle me-1"></i> Sign In / Register
                    </button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-4">
    <div class="row mb-4" id="tracker-section">
        <div class="col-12 col-lg-8 mx-auto">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-dark text-white p-3 d-flex justify-content-between align-items-center">
                    <h5 class="m-0 fw-semibold"><i class="bi bi-broadcast me-2 text-danger"></i>Real-Time Queue Tracker</h5>
                    <span class="badge bg-success rounded-pill px-3 py-2">System Active</span>
                </div>
                <div class="card-body p-4">
                    <div class="input-group mb-3">
                        <input type="text" id="track-token-input" class="form-control form-control-lg text-uppercase" placeholder="Enter Token (e.g. Q1019-001)">
                        <button class="btn btn-primary px-4 fw-bold" id="btn-poll-queue" type="button">Track Token</button>
                    </div>
                    <div id="queue-display-box" class="d-none mt-4">
                        <div class="row g-3 text-center">
                            <div class="col-6 col-md-3">
                                <div class="p-3 bg-light border rounded-3">
                                    <small class="text-muted fw-bold">YOUR TOKEN</small>
                                    <h3 class="text-primary mt-1 mb-0" id="disp-my-token">--</h3>
                                </div>
                            </div>
                            <div class="col-6 col-md-3">
                                <div class="p-3 bg-light border rounded-3">
                                    <small class="text-muted fw-bold">NOW SERVING</small>
                                    <h3 class="text-success mt-1 mb-0" id="disp-curr-token">--</h3>
                                </div>
                            </div>
                            <div class="col-6 col-md-3">
                                <div class="p-3 bg-light border rounded-3">
                                    <small class="text-muted fw-bold">AHEAD</small>
                                    <h3 class="text-dark mt-1 mb-0" id="disp-ahead">0</h3>
                                </div>
                            </div>
                            <div class="col-6 col-md-3">
                                <div class="p-3 bg-light border rounded-3">
                                    <small class="text-muted fw-bold">EST. WAIT</small>
                                    <h3 class="text-warning mt-1 mb-0" id="disp-est-wait">--</h3>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row" id="booking-section">
        <div class="col-12 col-lg-8 mx-auto">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">
                    <h3 class="fw-bold mb-1">Book Consultation</h3>
                    <p class="text-muted mb-4">Select service and choose an available dynamic time slot.</p>
                    <form id="booking-form">
                        <div class="row g-3 mb-3">
                            <div class="col-12 col-md-6">
                                <label class="form-label fw-semibold">Service</label>
                                <select class="form-select" id="book-service" required>
                                    <option value="" disabled selected>Choose a service...</option>
                                    <option value="1">Routine Cleaning (45m) - $85</option>
                                    <option value="2">Tooth Filling (60m) - $150</option>
                                    <option value="3">Tooth Extraction (60m) - $250</option>
                                </select>
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label fw-semibold">Attending Doctor</label>
                                <select class="form-select" id="book-staff" required>
                                    <option value="" disabled selected>Choose personnel...</option>
                                    <option value="2">Dr. Sarah Jenkins</option>
                                    <option value="3">Dr. Marcus Vance</option>
                                </select>
                            </div>
                        </div>
                        <div class="row g-3 mb-4">
                            <div class="col-12 col-md-6">
                                <label class="form-label fw-semibold">Date</label>
                                <input type="date" class="form-control" id="book-date" required>
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label fw-semibold">Available Slot</label>
                                <select class="form-select" id="book-slot" required disabled>
                                    <option value="" disabled selected>Choose doctor & date first...</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-semibold" id="btn-submit-booking">
                            Book & Get Queue Token
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="authModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow rounded-4 p-3">
            <div class="modal-header border-0 pb-0"><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <ul class="nav nav-pills nav-fill mb-3" id="authTabs">
                    <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#login-pane">Sign In</button></li>
                    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#reg-pane">Register</button></li>
                </ul>
                <div class="tab-content">
                    <div class="tab-pane fade show active" id="login-pane">
                        <form id="form-login">
                            <div class="mb-3"><label class="form-label small fw-bold">Email</label><input type="email" id="login-email" class="form-control" required></div>
                            <div class="mb-3"><label class="form-label small fw-bold">Password</label><input type="password" id="login-password" class="form-control" required></div>
                            <button type="submit" class="btn btn-primary w-100 rounded-pill">Sign In</button>
                        </form>
                    </div>
                    <div class="tab-pane fade" id="reg-pane">
                        <form id="form-register">
                            <div class="row g-2 mb-2">
                                <div class="col"><input type="text" id="reg-fn" class="form-control" placeholder="First Name" required></div>
                                <div class="col"><input type="text" id="reg-ln" class="form-control" placeholder="Last Name" required></div>
                            </div>
                            <div class="mb-2"><input type="email" id="reg-email" class="form-control" placeholder="Email" required></div>
                            <div class="mb-2"><input type="tel" id="reg-phone" class="form-control" placeholder="Phone" required></div>
                            <div class="mb-3"><input type="password" id="reg-pass" class="form-control" placeholder="Password (min 8 chars)" minlength="8" required></div>
                            <button type="submit" class="btn btn-success w-100 rounded-pill">Create Account</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
