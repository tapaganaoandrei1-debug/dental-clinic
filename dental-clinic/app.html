<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#123454">
    <title>SmileCare Dental</title>
    <link rel="stylesheet" href="assets/css/portal.css">
    <script src="assets/js/portal.js" defer></script>
</head>
<body>
    <header class="app-header">
        <a class="brand" href="#home" aria-label="SmileCare Dental home">
            <span class="brand-mark" aria-hidden="true">S</span>
            <span><strong>SmileCare Dental</strong><small>Care that keeps you smiling</small></span>
        </a>
        <nav id="main-navigation" class="main-navigation" aria-label="Main navigation"></nav>
        <div id="account-actions" class="account-actions"></div>
    </header>
    <main class="app-main">
        <div class="page-container">
            <div id="app-message" class="app-message" role="status" aria-live="polite" hidden></div>
            <section id="app-content" aria-live="polite">
                <div class="loading-card">Loading your clinic portal...</div>
            </section>
        </div>
    </main>
    <footer class="app-footer">
        <span>SmileCare Dental</span>
        <span>Patient care · Live appointments · Clinic queue</span>
    </footer>
</body>
</html>
